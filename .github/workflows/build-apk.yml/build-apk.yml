
name: Build Bloxy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q OpenBloxy_Android_Project.zip -d project

      - name: Build APK
        working-directory: project/OpenBloxyAndroid
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Bloxy-APK
          path: project/OpenBloxyAndroid/app/build/outputs/apk/debug/app-debug.apk
          
